<!-- script.html — Logique client, cache local, interactions -->
<script>
// ============================================================
//  CACHE LOCAL
//  Alimenté au chargement par Init_getDashboardData().
//  Mis à jour après chaque écriture réussie.
//  Jamais relu depuis le serveur tant que l'utilisateur
//  n'appuie pas sur "Actualiser" ou soumet un formulaire.
// ============================================================

let CACHE = {
  produits:   [],
  lots:       [],
  operateurs: [],
  timestamp:  null,
};

// ── Navigation ──────────────────────────────────────────────

function naviguerVers(idPage) {
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
  const cible = document.getElementById(idPage);
  if (cible) cible.classList.add('active');

  if (idPage === 'page-sortie') {
    _remplirSelectLots();
  } else if (idPage === 'page-reception') {
    DOM.form_reception.reset();
    basculerNouveauProduit('existant');
    DOM.rec_date_rec.value = new Date().toISOString().substring(0, 10);
    _remplirSelectProduits();
  }
}

// ── GESTION DE LA BASE DE DONNÉES ──

  /**
   * Tente de lier le document Google Sheet fourni
   */
  function connecterBaseDeDonnees(e) {
    e.preventDefault();
    const urlInput = document.getElementById('config-db-url').value;
    const btn = document.getElementById('btn-submit-config');
    
    btn.disabled = true;
    btn.textContent = "⏳ Validation et connexion...";

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = "Lier le document";
        
        if (res.ok) {
          afficherToast(res.message, false);
          // Si réussi, on retourne à l'accueil et on recharge les données
          naviguerVers('page-accueil');
          chargerDashboard();
        } else {
          afficherToast("Erreur : " + res.erreur, true);
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = "Lier le document";
        afficherToast("Erreur réseau : " + err.message, true);
      })
      .webapp_connectDatabase(urlInput);
  }

  /**
   * Récupère l'ID mémorisé pour pré-remplir le champ
   */
  function chargerConfigDb() {
    google.script.run.withSuccessHandler(function(res) {
      if (res.id) {
        document.getElementById('config-db-url').value = res.id;
      }
    }).Db_getDbConfig();
  }

  function deconnecterBaseDeDonnees() {
    if (!confirm("Voulez-vous vraiment déconnecter la base actuelle ? Vous devrez fournir un nouveau lien pour utiliser l'application.")) return;
    
    google.script.run.withSuccessHandler(function() {
      document.getElementById('config-db-url').value = "";
      afficherToast("Base déconnectée.", false);
      // Forcer le rechargement qui va échouer et rouvrir la configuration
      chargerDashboard(); 
    }).Db_deconnecterDb();
  }

// ── Chargement initial (et rafraîchissement) ────────────────

/**
 * Appelle le serveur pour recharger toutes les données.
 * Utilisé au chargement ET via le bouton "Actualiser".
 * @param {boolean} silencieux  - si true, ne montre pas le spinner
 */
function chargerDashboard(silencieux) {
  if (!silencieux) _setEtatChargement(true);

  google.script.run
    .withSuccessHandler(data => {
      _setEtatChargement(false);
      if (!data.ok) { afficherToast('Erreur : ' + data.erreur, true); return; }
      _mettreAJourCache(data);
      _afficherDashboard();
    })
    .withFailureHandler(err => {
      if (err.message.includes("DB_MISSING")) {
          afficherToast('Configuration requise : Veuillez lier une base de données.', true);
          naviguerVers('page-config');
          chargerConfigDb();
        } else {
          afficherToast('Erreur de chargement : ' + err.message, true);
          document.getElementById('liste-stock').innerHTML = '<div class="etat-vide">Impossible de charger les données.</div>';
        }
        _setEtatChargement(false);
    })
    .Init_getDashboardData();
}

/** Met à jour le cache local depuis la réponse serveur. */
function _mettreAJourCache(data) {
  CACHE.produits   = data.produits   || [];
  CACHE.lots       = data.lots       || [];
  CACHE.operateurs = data.operateurs || [];
  CACHE.timestamp  = data.timestamp  || new Date().toISOString();
  _remplirDatalistOperateurs();
}

// ── Affichage tableau de bord (depuis CACHE) ─────────────────

function _afficherDashboard() {
  const data = CACHE;

  // Stats
  if (DOM.stat_produits) DOM.stat_produits.textContent =
    data.produits.filter(p => p['Actif'] === 'OUI').length;
  if (DOM.stat_lots) DOM.stat_lots.textContent =
    data.lots.filter(l => l['Statut'] === 'En stock' || l['Statut'] === 'Stock bas').length;

  // Timestamp
  if (DOM.footer_timestamp && data.timestamp) {
    const d = new Date(data.timestamp);
    DOM.footer_timestamp.textContent =
      'Mis à jour à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  // Alertes calculées depuis le cache
  const produitsEnAlerte = data.produits.filter(p => {
    const a = String(p['Alerte stock'] || '');
    return a.includes('🔴') || a.includes('🟠');
  });
  const lotsEnAlerte = data.lots
    .filter(lot => {
      if (Number(lot['Quantité restante']) <= 0) return false;
      const s = lot['Statut'];
      if (s === 'Épuisé' || s === 'Retiré / Rappelé') return false;
      return _joursAvantPeremption(lot['Date de péremption']) <= 60;
    })
    .sort((a, b) =>
      _joursAvantPeremption(a['Date de péremption']) -
      _joursAvantPeremption(b['Date de péremption'])
    );

  _afficherAlerteStock(produitsEnAlerte);
  _afficherAlertePerem(lotsEnAlerte);
  _afficherStatusBar(produitsEnAlerte.length + lotsEnAlerte.length);

  // Date en sous-titre
  if (DOM.header_sub) {
    DOM.header_sub.textContent =
      new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  }
}

function _afficherAlerteStock(prods) {
  if (!DOM.liste_stock || !DOM.badge_stock) return;
  if (prods.length === 0) {
    DOM.badge_stock.textContent = '✓ OK';
    DOM.badge_stock.className   = 'badge badge--ok';
    DOM.liste_stock.innerHTML   = '<div class="etat-ok">🟢 Tous les stocks sont suffisants</div>';
    return;
  }
  DOM.badge_stock.textContent = prods.length;
  DOM.badge_stock.className   = 'badge';
  DOM.liste_stock.innerHTML   = prods.map(p => {
    const rupture = String(p['Alerte stock'] || '').includes('🔴');
    return `<div class="alerte-card">
      <div class="alerte-pastille ${rupture ? 'pastille-rouge' : 'pastille-orange'}"></div>
      <div class="alerte-info">
        <div class="alerte-nom">${escHtml(p['Nom du produit'] || '—')}</div>
        <div class="alerte-detail">
          Stock : <strong>${p['Stock total'] || 0}</strong>
          · Seuil : ${p['Seuil alerte (stock bas)'] || '—'}
          ${p['Emplacement'] ? ' · ' + escHtml(p['Emplacement']) : ''}
        </div>
      </div>
      <span class="alerte-tag ${rupture ? 'tag-rouge' : 'tag-orange'}">
        ${rupture ? 'RUPTURE' : 'STOCK BAS'}
      </span>
    </div>`;
  }).join('');
}

function _afficherAlertePerem(lots) {
  if (!DOM.liste_perem || !DOM.badge_perem) return;
  if (lots.length === 0) {
    DOM.badge_perem.textContent = '✓ OK';
    DOM.badge_perem.className   = 'badge badge--ok';
    DOM.liste_perem.innerHTML   = '<div class="etat-ok">🟢 Aucune péremption dans les 60 jours</div>';
    return;
  }
  DOM.badge_perem.textContent = lots.length;
  DOM.badge_perem.className   = 'badge';
  DOM.liste_perem.innerHTML   = lots.map(lot => {
    const jours  = _joursAvantPeremption(lot['Date de péremption']);
    const perime = jours < 0;
    const urgent = jours <= 30;
    const cls    = perime ? 'rouge' : urgent ? 'orange' : 'jaune';
    const tag    = perime ? 'PÉRIMÉ' : jours + ' j';
    return `<div class="alerte-card">
      <div class="alerte-pastille pastille-${cls}"></div>
      <div class="alerte-info">
        <div class="alerte-nom">${escHtml(lot['Nom produit'] || lot['Référence lot'] || '—')}</div>
        <div class="alerte-detail">
          Lot : ${escHtml(lot['Référence lot'] || '—')}
          · Expire le ${_formatDate(lot['Date de péremption'])}
          · Restant : <strong>${lot['Quantité restante'] || 0}</strong>
        </div>
      </div>
      <span class="alerte-tag tag-${cls}">${tag}</span>
    </div>`;
  }).join('');
}

function _afficherStatusBar(totalAlertes) {
  if (!DOM.status_bar) return;
  if (totalAlertes > 0) {
    DOM.status_bar.classList.add('actif');
    DOM.status_bar_texte.textContent =
      totalAlertes + ' alerte' + (totalAlertes > 1 ? 's' : '') + ' à traiter';
  } else {
    DOM.status_bar.classList.remove('actif');
  }
}

// ── Sélects formulaires (depuis CACHE) ──────────────────────

function _remplirSelectProduits() {
  const sel = DOM.rec_id_produit;
  if (!sel) return;
  sel.innerHTML = '<option value="">-- Choisir un produit --</option>';
  CACHE.produits
    .filter(p => p['Actif'] === 'OUI')
    .forEach(p => {
      const opt = document.createElement('option');
      opt.value       = p['ID Produit'];
      opt.textContent = p['Nom du produit'] + ' (' + (p['Stock total'] || 0) + ' en stock)';
      sel.appendChild(opt);
    });
}

function _remplirSelectLots() {
  const sel = DOM.sor_ref_lot;
  if (!sel) return;
  sel.innerHTML = '<option value="">-- Choisir un lot en stock --</option>';
  CACHE.lots
    .filter(l => l['Statut'] === 'En stock' || l['Statut'] === 'Stock bas')
    .forEach(l => {
      const opt = document.createElement('option');
      opt.value       = l['Référence lot'];
      opt.textContent = `${l['Nom produit']} · ${l['Référence lot']} · ${l['Quantité restante']} restant(s)`;
      sel.appendChild(opt);
    });
}

function _remplirDatalistOperateurs() {
  const dl = DOM.liste_operateurs;
  if (!dl) return;
  dl.innerHTML = CACHE.operateurs.map(op => `<option value="${escHtml(op)}">`).join('');
}

// ── Aperçu lot sélectionné (formulaire sortie) ───────────────

function mettreAJourApercuLot(refLot) {
  const div = DOM.apercu_stock_lot;
  if (!div) return;
  if (!refLot) { div.innerHTML = ''; div.removeAttribute('data-max'); return; }
  const lot = CACHE.lots.find(l => l['Référence lot'] === refLot);
  if (!lot) { div.innerHTML = ''; return; }
  const qte    = Number(lot['Quantité restante']);
  const perem  = _formatDate(lot['Date de péremption']);
  const alerte = lot['Alerte péremption'] || '';
  div.setAttribute('data-max', qte);
  div.innerHTML = `
    <span style="color:${qte <= 3 ? 'var(--rouge)' : 'var(--vert)'}">
      📦 ${qte} unité(s) disponible(s)
    </span>
    · 📅 Exp : ${perem} ${alerte ? '· ' + alerte : ''}`;
}

// ── Bascule nouveau produit ───────────────────────────────────

function basculerNouveauProduit(type) {
  const isNouveau = (type === 'nouveau');
  DOM.bloc_produit_existant.style.display = isNouveau ? 'none' : 'block';
  DOM.bloc_nouveau_produit.style.display  = isNouveau ? 'block' : 'none';
  DOM.rec_id_produit.required = !isNouveau;
  DOM.rec_nom_prod.required   = isNouveau; // bug #5 corrigé : rec_nom_prod
}

// ── Soumission réception ──────────────────────────────────────

function soumettreReception(e) {
  e.preventDefault();
  const isNouveau = DOM.rec_type_produit.value === 'nouveau';
  const payload = {
    isNouveauProduit:   isNouveau,
    idProduit:          isNouveau ? null : DOM.rec_id_produit.value,
    prodNom:            isNouveau ? DOM.rec_nom_prod.value.trim() : null,
    prodCatReg:         isNouveau ? DOM.rec_cat_reg.value : null,
    prodCatUsage:       isNouveau ? DOM.rec_cat_usage.value : null,
    prodUnite:          isNouveau ? DOM.rec_unite.value : null,
    prodSeuil:          isNouveau ? DOM.rec_seuil.value : null,
    numLotFournisseur:  DOM.rec_lot_fourn.value.trim(),
    qteRecue:           DOM.rec_qte.value,
    dateReception:      DOM.rec_date_rec.value,
    datePeremption:     DOM.rec_date_pem.value,
    fournisseur:        DOM.rec_fournisseur.value.trim(),
    emplacement:        DOM.rec_emplacement.value.trim(),
    effectuePar:        DOM.rec_operateur.value.trim(),
  };

  if (!payload.numLotFournisseur) { afficherToast('N° lot fournisseur requis.', true); return; }
  if (!payload.qteRecue || Number(payload.qteRecue) <= 0) { afficherToast('Quantité invalide.', true); return; }
  if (!payload.effectuePar) { afficherToast('Nom de l\'opérateur requis.', true); return; }

  _setBtn(DOM.btn_submit_rec, true, '⏳ Enregistrement…');
  google.script.run
    .withSuccessHandler(res => {
      _setBtn(DOM.btn_submit_rec, false, 'Enregistrer la Réception');
      if (res.ok) {
        afficherToast('✅ Réception enregistrée · Lot : ' + res.refLot);
        DOM.form_reception.reset();
        chargerDashboard(true); // rafraîchit le cache silencieusement
        naviguerVers('page-accueil');
      } else {
        afficherToast('Erreur : ' + res.erreur, true);
      }
    })
    .withFailureHandler(err => {
      _setBtn(DOM.btn_submit_rec, false, 'Enregistrer la Réception');
      afficherToast('Erreur système : ' + err.message, true);
    })
    .Init_enregistrerReception(payload);
}

// ── Soumission sortie ─────────────────────────────────────────

function soumettreSortie(e) {
  e.preventDefault();
  const refLot    = DOM.sor_ref_lot.value;
  const quantite  = parseInt(DOM.sor_qte.value);
  const operateur = DOM.sor_operateur.value.trim();
  const div       = DOM.apercu_stock_lot;
  const maxCache  = parseInt(div ? (div.getAttribute('data-max') || 0) : 0);

  if (!refLot)                             { afficherToast('Veuillez sélectionner un lot.', true); return; }
  if (isNaN(quantite) || quantite <= 0)    { afficherToast('Quantité invalide.', true); return; }
  if (quantite > maxCache)                 { afficherToast(`Stock insuffisant (cache : ${maxCache}).`, true); return; }
  if (!operateur)                          { afficherToast('Nom de l\'opérateur requis.', true); return; }

  const payload = { refLot, quantite, effectuePar: operateur,
                    commentaire: DOM.sor_commentaire.value.trim() };

  // Snapshot du cache pour détection de conflit côté serveur
  const lotCache = CACHE.lots.find(l => l['Référence lot'] === refLot);
  const snapshotCache = lotCache ? { refLot, qteRestante: lotCache['Quantité restante'] } : null;

  _setBtn(DOM.btn_submit_sor, true, '⏳ Validation…');
  google.script.run
    .withSuccessHandler(res => {
      _setBtn(DOM.btn_submit_sor, false, 'Valider le Prélèvement');
      if (res.ok) {
        afficherToast('✅ Sortie enregistrée · Restant : ' + res.qteApres);
        DOM.form_sortie.reset();
        if (div) { div.innerHTML = ''; div.removeAttribute('data-max'); }
        chargerDashboard(true);
        naviguerVers('page-accueil');
      } else if (res.conflit) {
        // Conflit : on recharge le cache et on prévient l'utilisateur
        afficherToast('⚠️ ' + res.erreur, true);
        chargerDashboard(true);
      } else {
        afficherToast('Erreur : ' + res.erreur, true);
      }
    })
    .withFailureHandler(err => {
      _setBtn(DOM.btn_submit_sor, false, 'Valider le Prélèvement');
      afficherToast('Erreur système : ' + err.message, true);
    })
    .Init_enregistrerSortie(payload, snapshotCache);
}

// ── Toast ─────────────────────────────────────────────────────

let _toastTimer = null;
function afficherToast(msg, erreur) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className   = 'toast' + (erreur ? ' erreur' : '');
  void el.offsetWidth; // force reflow pour relancer la transition
  el.classList.add('visible');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('visible'), 3600);
}

// ── Helpers internes ──────────────────────────────────────────

function _setEtatChargement(actif) {
  const btn = document.getElementById('btn-actualiser');
  if (btn) btn.textContent = actif ? '⏳' : '🔄 Actualiser';
  if (DOM.liste_stock) DOM.liste_stock.innerHTML =
    actif ? '<div class="etat-vide"><span class="spinner"></span> Chargement…</div>' : '';
  if (DOM.liste_perem) DOM.liste_perem.innerHTML =
    actif ? '<div class="etat-vide"><span class="spinner"></span> Chargement…</div>' : '';
}

function _setBtn(btn, desactive, texte) {
  if (!btn) return;
  btn.disabled     = desactive;
  btn.textContent  = texte;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function _formatDate(val) {
  if (!val) return '—';
  try {
    const d = new Date(val);
    return isNaN(d) ? String(val)
      : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  } catch (_) { return String(val); }
}

function _joursAvantPeremption(datePer) {
  if (!datePer) return 9999;
  const p = new Date(datePer); p.setHours(0,0,0,0);
  const n = new Date();        n.setHours(0,0,0,0);
  return Math.round((p - n) / 86400000);
}

// ── Lancement ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => chargerDashboard());
</script>
